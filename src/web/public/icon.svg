<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ef6f5a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Anillo de progreso. Todo queda dentro de la zona segura de los iconos maskable (r < 205). -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="32"/>
