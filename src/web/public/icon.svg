    <line x1="180.6" y1="270.3" x2="159.4" y2="264.6"/>
  </g>
  <path d="M208 290a48 48 0 0 1 96 0z" fill="#fff"/>
  <rect x="168" y="302" width="176" height="14" rx="7" fill="#fff"/>
